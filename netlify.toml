[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 🔥 OG PROPERTY — ABSOLUTELY FIRST (NO CONDITIONS)
[[redirects]]
  from = "/og/property/*"
  to = "/.netlify/functions/og-property"
  status = 200
  force = true

# SPA fallback (React)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
