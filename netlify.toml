[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 🔥 OG PROPERTY — MUST BE FIRST
[[redirects]]
  from = "/og/property/*"
  to = "/.netlify/functions/og-property"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
